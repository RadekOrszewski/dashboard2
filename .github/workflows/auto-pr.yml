name: Auto PR

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.AUTO_PR_TOKEN || github.token }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          existing=$(gh pr list --repo "$REPO" --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create --repo "$REPO" --head "$BRANCH" --base main \
              --title "$(gh api repos/$REPO/commits/$BRANCH --jq '.commit.message' | head -n1)" \
              --body "Automatycznie utworzony PR z gałęzi \`$BRANCH\`."
          fi
          gh pr merge --repo "$REPO" "$BRANCH" --squash --auto
